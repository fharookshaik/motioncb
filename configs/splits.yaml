# Spatial block splits. The test split is frozen once created: never regenerate
# it after the first ablation run (docs/decisions.md must record any change).

split_version: s1
seed: 20261103
block_size_m: 20000          # 20 km blocks on EPSG:3035
chip_size_m: 2560            # 256 px at 10 m; also the border buffer width
restarts: 400                # random greedy restarts; best-balanced kept
max_rel_deviation: 0.05      # acceptance: each split within +-5% (relative) of its target

# Germany bounding box (WGS84) used to lay the grid; blocks are later
# restricted to land/Germany by the imagery pipeline (M2).
grid_bbox_wgs84: [5.5, 47.2, 15.5, 57.4]   # includes the three retained Danish sites

# Region groups for stratified balancing: BKG VG250 Laender (AGS codes), ROADMAP M1.4.
# Hamburg, Bremen and Saarland are small; they stay grouped to keep each group balanceable.
region_source:
  path: data/raw/bkg_vg250/vg250_ebenen_0101/DE_VG250.gpkg
  layer: vg250_lan
  groups:
    North: ["01", "02", "03", "04", "13"]   # SH, HH, NI, HB, MV
    West:  ["05", "06", "07", "10"]         # NW, HE, RP, SL
    South: ["08", "09"]                     # BW, BY
    East:  ["11", "12", "14", "15", "16"]   # BE, BB, SN, ST, TH

fractions:
  train: 0.70
  val: 0.10
  test: 0.20

cv_folds: 5                  # for the final robustness check only (ROADMAP M9)

outputs:
  blocks: data/processed/splits_{split_version}_blocks.gpkg
  polygon_assignment: data/processed/splits_{split_version}_polygons.csv
  report: data/processed/splits_{split_version}_report.json

# Retained M1.3 sample uses the archived quadrant draw, not a redraw on current s1.
audit:
  out_dir: runs/audit_m1_3
  windows: runs/audit_m1_3/windows.gpkg
  form: runs/audit_m1_3/audit_form.csv
  labels: data/interim/labels_v1.gpkg
  excluded_outside_counts: {W40: 2}  # CSV notes explicitly locate both farms outside the window
  seed: 20261106
  resamples: 10000
