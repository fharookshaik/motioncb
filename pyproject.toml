[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarde"
version = "0.1.0"
description = "Ablation study: ground-mounted PV segmentation in Germany from open satellite imagery"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "pyogrio",
  "shapely>=2.0",
  "pandas>=2.2",
  "numpy",
  "pyyaml",
  "openpyxl",
  "xarray",
  "rioxarray",
  "scipy",
  "scikit-image",
  "statsmodels",
  "matplotlib",
  "jupyterlab",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
geo = ["rasterio", "dask", "zarr"]
train = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "torchaudio==2.9.1",
  "lightning",
  "hydra-core",
  "segmentation-models-pytorch",
  "timm",
  "torchgeo",
  "terratorch",
  "mlflow",
]
imagery = ["earthengine-api", "pystac-client", "planetary-computer", "odc-stac"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
